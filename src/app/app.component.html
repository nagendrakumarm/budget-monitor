<mat-sidenav-container class="app-container">

  <!-- SIDENAV -->
  <mat-sidenav
    #sidenav
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="!isMobile"
  >
    <mat-toolbar color="primary">Budget Monitor</mat-toolbar>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" (click)="closeIfMobile()">Dashboard</a>
      <a mat-list-item routerLink="/transactions" (click)="closeIfMobile()">Transactions</a>
      <a mat-list-item routerLink="/transactions/new" (click)="closeIfMobile()">Add Transaction</a>
      <a mat-list-item routerLink="/upload" (click)="closeIfMobile()">Upload Bulk Transactions</a>
      <a mat-list-item routerLink="/payments" (click)="closeIfMobile()">Payments</a>
      <a mat-list-item routerLink="/monthly" (click)="closeIfMobile()">Monthly History</a>
      <a mat-list-item routerLink="/alltransactions" (click)="closeIfMobile()">All Transactions</a>
      <a mat-list-item routerLink="/giftcards" (click)="closeIfMobile()">Gift Cards</a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- MAIN CONTENT -->
  <mat-sidenav-content>

    <!-- TOP TOOLBAR -->
    <mat-toolbar color="primary">

      <!-- Hamburger only on mobile -->
      <button
        *ngIf="isMobile"
        mat-icon-button
        (click)="sidenav.toggle()"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <span>{{ title }}</span>
    </mat-toolbar>

    <div class="app-content">
      <router-outlet></router-outlet>
    </div>

  </mat-sidenav-content>

</mat-sidenav-container>
