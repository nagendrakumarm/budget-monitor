<div class="login-container">
  <mat-card class="login-card">
    
    <mat-card-header class="login-header">
      <div class="brand-icon">
        <mat-icon color="primary">lock</mat-icon>
      </div>
      <mat-card-title>Welcome Back</mat-card-title>
      <mat-card-subtitle>Please enter your details to sign in</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="login()" class="login-form">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email Address</mat-label>
          <mat-icon matPrefix>email</mat-icon>
          <input matInput 
                 type="email" 
                 formControlName="email" 
                 placeholder="name@example.com"
                 autocomplete="email"
                 inputmode="email">
          <mat-error *ngIf="form.get('email')?.hasError('email')">
            Please enter a valid email address
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <mat-icon matPrefix>lock_open</mat-icon>
          <input matInput 
                 [type]="hidePassword ? 'password' : 'text'" 
                 formControlName="password"
                 autocomplete="current-password">
          
          <button mat-icon-button 
                  matSuffix 
                  type="button" 
                  (click)="hidePassword = !hidePassword" 
                  [attr.aria-label]="hidePassword ? 'Hide password' : 'Show password'"
                  [attr.aria-pressed]="!hidePassword">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>

        <div class="form-actions">
          <button mat-flat-button 
                  color="primary" 
                  type="submit" 
                  class="submit-btn" 
                  [disabled]="loading || form.invalid">
            <mat-spinner *ngIf="loading" diameter="24" class="btn-spinner"></mat-spinner>
            <span *ngIf="!loading">Sign In</span>
          </button>
        </div>

      </form>
    </mat-card-content>

  </mat-card>
</div>
