<section class="summary-card">
  <h2>{{ selectedYear }} Category Summary</h2>

  <div class="table-wrapper">
    <table class="summary-table">
      <thead>
        <tr>
          <th>Category</th>
          <th *ngFor="let m of months">{{ m }}</th>
          <th>Total</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let row of categoryTotals"
          [class.type-row]="row.isType"
          [class.cat-row]="row.isCat"
        >
          <td>{{ row.name }}</td>
          <td *ngFor="let m of months">
            {{ row.months[m] || 0 | number:'1.0-0' }}
          </td>
          <td>{{ row.total | number:'1.0-0' }}</td>
        </tr>
        <tr class="total-row">
          <td><strong>Total</strong></td>

          <td *ngFor="let m of months">
            <strong>{{ monthlyTotals[m] | number:'1.0-0' }}</strong>
          </td>

          <td>
            <strong>{{ getMonthlyGrandTotal() | number:'1.0-0' }}</strong>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
