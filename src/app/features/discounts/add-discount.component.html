<div class="page-container">
  <mat-card>
    <h2>Add Discount / Cashback</h2>

    <form [formGroup]="form" (ngSubmit)="save()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Account</mat-label>
        <mat-select formControlName="accountId" (selectionChange)="onAccountChange($event.value)">
          <mat-option *ngFor="let a of accounts" [value]="a.id">{{ a.name }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Merchant</mat-label>
        <input matInput formControlName="merchant" placeholder="e.g. Amazon">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description" placeholder="e.g. 5% cashback on groceries"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Expiry Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="expiryDate">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit">Save Discount</button>
    </form>
  </mat-card>
</div>
